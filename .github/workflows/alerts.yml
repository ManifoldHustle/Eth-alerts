name: eth-alerts

on:
  schedule:
    # 2 minutes after each 15m candle closes (GitHub may run it a few minutes late)
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run | test | status | report | backtest"
        default: "run"
      days:
        description: "backtest only: days of history (7-365)"
        default: "60"
      asset:
        description: "backtest only: market to test, e.g. ETH, BTC, SUI"
        default: "ETH"

permissions:
  contents: write

concurrency:
  group: eth-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BALANCE: ${{ vars.BALANCE }}
          RISK_PCT: ${{ vars.RISK_PCT }}
          LEVERAGE: ${{ vars.LEVERAGE }}
          MIN_RR: ${{ vars.MIN_RR }}
          SL_ATR_MULT: ${{ vars.SL_ATR_MULT }}
          VOL_REQUIRED: ${{ vars.VOL_REQUIRED }}
          BTC_FILTER: ${{ vars.BTC_FILTER }}
          NEAR_MISS: ${{ vars.NEAR_MISS }}
          NEAR_RR_FLOOR: ${{ vars.NEAR_RR_FLOOR }}
          TRADE: ${{ vars.TRADE }}
          PAUSE_IN_TRADE: ${{ vars.PAUSE_IN_TRADE }}
          TIME_STOP_H: ${{ vars.TIME_STOP_H }}
          TP1_PORTION: ${{ vars.TP1_PORTION }}
          TP2_R: ${{ vars.TP2_R }}
          MAX_ATR_PCT: ${{ vars.MAX_ATR_PCT }}
          MAX_VOL_RATIO: ${{ vars.MAX_VOL_RATIO }}
          FLIPPED_ONLY: ${{ vars.FLIPPED_ONLY }}
          MODE: ${{ github.event.inputs.mode }}
          DAYS: ${{ github.event.inputs.days }}
          ASSET: ${{ github.event.inputs.asset }}
        run: |
          case "$MODE" in
            test) python alert_bot.py --test-telegram ;;
            status) python alert_bot.py --status ;;
            report) python alert_bot.py --report ;;
            backtest) python alert_bot.py --backtest "${DAYS:-60}" ;;
            *) python alert_bot.py ;;
          esac
      - name: Save alert memory (prevents duplicate alerts)
        run: |
          git config user.name "alert-bot"
          git config user.email "alert-bot@users.noreply.github.com"
          git add state.json alerts_log.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "update alert memory" && git push)
